name: Android UI Tests with Appium

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Appium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 android-sdk adb unzip curl

      - name: Install Appium CLI
        run: |
          npm install -g appium@1.22.3
          appium -v

      - name: Start Appium in background
        run: |
          nohup appium > appium.log 2>&1 &
          sleep 5

      - name: Set Android SDK env vars
        run: |
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV

      - name: Build with Maven
        run: mvn clean install

      - name: Run tests
        run: mvn test
